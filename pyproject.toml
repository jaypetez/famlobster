[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "famlobster"
version = "0.1.0"
description = "A personal Telegram assistant powered by Claude AI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==22.8",
    "anthropic>=0.40.0",
    "mcp==1.1.2",
    "google-api-python-client==2.201.0",
    "google-auth-httplib2==0.4.4",
    "google-auth-oauthlib==1.5.0",
    "APScheduler==3.11.3",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.1",
    "pip-audit>=2.7",
]

[project.scripts]
famlobster = "famlobster.bot:main"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["famlobster"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Baseline: these codes flag existing Optional/union handling in bot.py, agent.py and
# reminders.py. Re-enable them as the code is tightened.
disable_error_code = ["union-attr", "arg-type", "return-value"]
